services:

  postgres:
    image: postgres:16-alpine
    container_name: events_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events-db
    # Roda *.sql em /docker-entrypoint-initdb.d/ só na primeira subida (volume vazio).
    # Para aplicar de novo do zero: docker compose down -v && docker compose up -d
    volumes:
      - ./internal/infrastructure/persistence/postgres/migrations/001_processed_events.sql:/docker-entrypoint-initdb.d/01_processed_events.sql:ro

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  processor-1:
    build: .
    environment:
      WORKER_ID: processor-1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgres://events:events@postgres:5432/events-db?sslmode=disable
    depends_on:
      - rabbitmq
      - postgres

  processor-2:
    build: .
    environment:
      WORKER_ID: processor-2
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgres://events:events@postgres:5432/events-db?sslmode=disable
    depends_on:
      - rabbitmq
      - postgres

  processor-3:
    build: .
    environment:
      WORKER_ID: processor-3
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgres://events:events@postgres:5432/events-db?sslmode=disable
    depends_on:
      - rabbitmq
      - postgres